<!DOCTYPE html>
<html lang="en">

<body>
        <h1>Database-backed Student API</h1>
        <h2>This API is a simple CRUD API for managing student records.</h2>

        <p>This API uses MongoDB instead of students.json.</p>

    <ul>
        <li ><a href="/api/students">       GET /api/students </a></li>
        <li><a href="/api/students/:id">    GET /api/students/:id </a></li>
        <li><a href="/api/students">        POST /api/students </a></li>
        <li><a href="/api/students/:id">    PATCH /api/students/:id </a></li>
        <li><a href="/api/students/:id">    DELETE /api/students/:id </a></li>
        
    </ul>
</body>
